<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch LinkedIn post</title>
<link rel="stylesheet" href="launch.css">
<style>
  /* 1080×1350 (4:5): the tallest image LinkedIn shows uncropped in the feed. */
  .canvas { width: 1080px; height: 1350px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chips span { font: 500 21px 'JetBrains Mono', monospace; color: #cbd5e1; padding: 10px 18px; border-radius: 999px; border: 1.5px solid #222b45; background: rgba(255, 255, 255, 0.02); }
</style>
</head>
<body>
<div class="canvas">
  <svg class="layer" style="inset:0" width="1080" height="1350" viewBox="0 0 1080 1350">
    <defs><linearGradient id="lit" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
    <path class="trace" d="M1090 36H900l-30 30H720"/><circle class="node" cx="720" cy="66" r="9"/>
    <path class="trace lit" d="M1090 84H960l-30 30H800"/><circle class="node lit" cx="800" cy="114" r="9"/>
    <path class="trace" d="M1090 1306H800l-36-36H640"/><circle class="node" cx="640" cy="1270" r="9"/>
  </svg>

  <div class="layer brand" style="left:60px; top:56px">
    <svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="g1" x1="4" y1="6" x2="60" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><path d="M8 10v44M22.5 10v44M8 32h14.5M37 54V10l9.5 9.5L56 10v44" stroke="url(#g1)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#04060b" stroke="url(#g1)" stroke-width="2.6"><circle cx="8" cy="10" r="3.8"/><circle cx="8" cy="54" r="3.8"/><circle cx="22.5" cy="10" r="3.8"/><circle cx="22.5" cy="54" r="3.8"/><circle cx="37" cy="54" r="3.8"/><circle cx="56" cy="54" r="3.8"/></g><g fill="#e2e8f0"><circle cx="8" cy="32" r="2.4"/><circle cx="22.5" cy="32" r="2.4"/><circle cx="46.5" cy="19.5" r="2.4"/></g></svg>
    Housein Monzer
  </div>

  <h1 class="layer headline" style="left:56px; top:138px; font-size:100px">New design.<br><span class="grad">New style.</span></h1>
  <p class="layer sub" style="left:60px; top:340px; width:900px; font-size:32px">I rebuilt my portfolio from the ground up.</p>

  <!-- Desktop in a browser -->
  <div class="layer browser" style="left:60px; top:420px; width:960px">
    <div class="bar"><i></i><i></i><i></i><span class="addr">houseinmonzer.vercel.app</span></div>
    <img src="img/site-desktop.png" alt="">
  </div>

  <!-- Same site on a phone, overlapping the browser -->
  <div class="layer phone" style="left:800px; top:640px; width:250px; border-radius:40px; padding:9px; transform:rotate(-4deg)">
    <div class="screen" style="border-radius:32px">
      <span class="notch" style="top:9px; height:17px; border-radius:12px"></span>
      <img src="img/site-mobile.png" alt="">
      <span class="role">Full-Stack Developer</span>
    </div>
  </div>

  <div class="layer chips" style="left:60px; top:1112px; width:720px">
    <span>3D particle hero</span><span>New logo &amp; brand</span><span>React + TypeScript</span><span>Three.js</span>
  </div>
  <p class="layer url" style="left:60px; top:1262px; font-size:26px">→ houseinmonzer<i>.vercel.app</i></p>
</div>
</body>
</html>
